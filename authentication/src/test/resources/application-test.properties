spring.application.name=authentication-microservice

spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.datasource.url=mock
spring.datasource.username=mock
spring.datasource.password=mock

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.port=8080

app.dynamodb.notification.token.table=mock

# cache
spring.data.redis.host=mock
spring.data.redis.port=1234
spring.data.redis.password=mock
